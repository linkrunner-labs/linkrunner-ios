name: SDK version check

# Blocks a PR whose code declares an SDK version that is not recorded as the
# latest entry in config-sdk-version.json. PRs that do not change the SDK
# version are unaffected.
#
# Runs on macOS because the checker is a Swift script and Swift ships with
# Xcode. NOTE: for this to actually prevent a merge, add "SDK version check"
# as a required status check in the branch protection rules for main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sdk-version:
    name: SDK version check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the SDK version is recorded in config-sdk-version.json
        run: swift Scripts/check-sdk-version.swift
