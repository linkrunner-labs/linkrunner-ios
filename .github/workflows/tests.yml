name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,ds in d.items() if "iOS" in r for x in ds if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run tests with Thread Sanitizer
        run: |
          xcodebuild test \
            -scheme LinkrunnerKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -enableThreadSanitizer YES \
            -skip-testing:LinkrunnerKitTests/TCFConsentTests/testUnexpectedCharacterInPurposeStringYieldsUnknown
